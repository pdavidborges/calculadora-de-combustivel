<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Combustível</title>

    <!-- Ligação entre HTML e CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="principal">
        
        <div class="imagem-principal">
            <img src="foto.webp" width="400" alt="Foto de um carro abastecendo">
        </div>

        <div class="conteudo">
            <h1>Qual combustível é melhor?</h1>
            <p>Preencha os campos e veja qual é o mais vantajoso.</p>
            
            <form onsubmit="verificarCombustivel(event)">
                <label for="gasolina">Valor do litro da Gasolina</label><br>        
                <input type="number" step="0.01" id="gasolina" required placeholder="Ex: 6.50"><br>

                <label for="etanol">Valor do litro do Etanol</label><br>        
                <input type="number" step="0.01" id="etanol" required placeholder="Ex: 4.90"><br>
                                
                <button type="submit">Calcular</button>                
            </form>

            <!-- <h2>Abasteça com Gasolina</h2> -->
            <div id="resposta"></div>

        </div>

        <div class="rodape">
            <p>Desenvolvidor por Coti Informática</p>
        </div>
    </div>


    <!-- Ligação entre o HTML e o JS -->
    <script src="script.js"></script>

</body>
</html>
